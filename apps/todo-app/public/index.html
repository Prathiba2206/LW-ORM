<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Todo App</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div class="container">
    <h1>📝 Todo App</h1>

    <form id="todo-form">
      <input
        type="text"
        id="todo-input"
        placeholder="What needs to be done?"
        maxlength="200"
        required
      />
      <button type="submit">Add</button>
    </form>

    <div class="filters">
      <button class="filter-btn active" data-filter="all">All</button>
      <button class="filter-btn" data-filter="active">Active</button>
      <button class="filter-btn" data-filter="completed">Completed</button>
    </div>

    <ul id="todo-list"></ul>
    <p id="empty-msg" class="empty" hidden>No todos yet — add one above!</p>
  </div>

  <script>
    const form = document.getElementById("todo-form");
    const input = document.getElementById("todo-input");
    const list = document.getElementById("todo-list");
    const emptyMsg = document.getElementById("empty-msg");
    const filterBtns = document.querySelectorAll(".filter-btn");
    let currentFilter = "all";

    async function fetchTodos() {
      const query = currentFilter === "all" ? "" : `?filter=${currentFilter}`;
      const res = await fetch(`/api/todos${query}`);
      const todos = await res.json();
      renderTodos(todos);
    }

    function renderTodos(todos) {
      list.innerHTML = "";
      emptyMsg.hidden = todos.length > 0;
      todos.forEach((todo) => {
        const li = document.createElement("li");
        li.className = todo.completed ? "completed" : "";
        li.innerHTML = `
          <label>
            <input type="checkbox" ${todo.completed ? "checked" : ""} onchange="toggleTodo(${todo.id}, this.checked)" />
            <span>${escapeHtml(todo.title)}</span>
          </label>
          <button class="delete-btn" onclick="deleteTodo(${todo.id})">✕</button>
        `;
        list.appendChild(li);
      });
    }

    function escapeHtml(text) {
      const div = document.createElement("div");
      div.textContent = text;
      return div.innerHTML;
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const title = input.value.trim();
      if (!title) return;
      await fetch("/api/todos", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ title }),
      });
      input.value = "";
      fetchTodos();
    });

    async function toggleTodo(id, completed) {
      await fetch(`/api/todos/${id}`, {
        method: "PATCH",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ completed }),
      });
      fetchTodos();
    }

    async function deleteTodo(id) {
      await fetch(`/api/todos/${id}`, { method: "DELETE" });
      fetchTodos();
    }

    filterBtns.forEach((btn) => {
      btn.addEventListener("click", () => {
        filterBtns.forEach((b) => b.classList.remove("active"));
        btn.classList.add("active");
        currentFilter = btn.dataset.filter;
        fetchTodos();
      });
    });

    fetchTodos();
  </script>
</body>
</html>
